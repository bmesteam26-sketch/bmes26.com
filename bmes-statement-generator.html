<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMES Statement of Invoices</title>
<style>
  :root{
    --ink:#14213d; --blue:#1f4fa3; --muted:#5b667a; --rule:#cfd6e2;
    --panel:#eef1f6; --paper:#ffffff; --warn:#b3261e;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#e8ecf5; --blue:#7fa6ee; --muted:#9aa5bb; --rule:#2c3750; --panel:#161d2e; --warn:#ff8a80; }
    body{ background:#0f1522; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#e3e8f1;line-height:1.45}
  .app{display:grid;grid-template-columns:340px 1fr;gap:20px;max-width:1180px;margin:0 auto;padding:20px}
  @media(max-width:860px){.app{grid-template-columns:1fr;padding:12px}}

  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:16px;align-self:start}
  .panel h2{font-size:15px;margin:18px 0 8px}
  .panel h2:first-child{margin-top:0}
  label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
  input{width:100%;font:inherit;font-size:15px;padding:8px 9px;border:1px solid var(--rule);border-radius:6px;background:#fff;color:#14213d}
  input:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button{font:inherit;font-size:14px;padding:9px 12px;border-radius:6px;border:1px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer}
  button.ghost{background:transparent;color:var(--blue)}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .status{font-size:12.5px;color:var(--muted);margin-top:8px;min-height:18px}
  .status.err{color:var(--warn)}

  /* statement sheet */
  .sheet{background:#fff;color:#14213d;border-radius:4px;padding:36px 40px;min-height:640px;box-shadow:0 1px 3px rgba(20,33,61,.18)}
  @media(max-width:600px){.sheet{padding:20px 16px}}
  .head{display:flex;gap:16px;align-items:center;border-bottom:3px solid #1f4fa3;padding-bottom:14px}
  .head img{flex:none;width:84px;height:84px;display:block}
  .head h1{font-size:19px;margin:0 0 2px;line-height:1.2}
  .head p{margin:0;font-size:12.5px;color:#4a566c}
  .title{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 6px;flex-wrap:wrap;gap:6px}
  .title h2{margin:0;font-size:22px}
  .meta{font-size:13.5px;color:#4a566c}
  .to{margin:14px 0 18px;font-size:15px}
  .to b{font-size:17px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-weight:600;font-size:12.5px;color:#4a566c;border-bottom:2px solid #14213d;padding:7px 6px}
  td{padding:8px 6px;border-bottom:1px solid #dde3ee;vertical-align:top}
  th.n,td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.paid td{color:#7b8598}
  tr.paid td.d{text-decoration:line-through}
  .tag{font-size:11.5px;color:#1d7a46;font-weight:600}
  .totals{margin:18px 0 0 auto;width:min(320px,100%)}
  .totals div{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
  .totals .due{border-top:2px solid #14213d;margin-top:6px;padding-top:9px;font-size:19px;font-weight:800;color:#1f4fa3}
  .bank{margin-top:28px;font-size:13.5px;border-top:1px solid #dde3ee;padding-top:12px}
  .bank b{display:block;margin-bottom:4px}
  .empty{padding:36px 8px;text-align:center;color:#4a566c}
  .foot{margin-top:26px;font-size:12px;color:#7b8598}
  .act{white-space:nowrap}
  .act button{padding:2px 8px;font-size:12px;margin-left:4px}
  .act .del{border-color:#b3261e;color:#b3261e;background:transparent}
  .act input{width:auto;vertical-align:middle}

  @media print{
    body{background:#fff}
    .panel,.no-print{display:none !important}
    .app{display:block;padding:0;max-width:none}
    .sheet{box-shadow:none;padding:0;min-height:0}
    @page{margin:16mm}
  }
</style>
</head>
<body>
<div class="app">

  <aside class="panel">
    <h2>Statement details</h2>
    <label for="client">Client name</label>
    <input id="client" placeholder="Client name" autocomplete="off">
    <label for="stDate">Statement date</label>
    <input type="date" id="stDate">
    <div class="row">
      <div><label for="from">Period from</label><input type="date" id="from"></div>
      <div><label for="to">Period to</label><input type="date" id="to"></div>
    </div>

    <h2>Add an invoice</h2>
    <div class="row">
      <div><label for="aDate">Date</label><input type="date" id="aDate"></div>
      <div><label for="aNo">Invoice no.</label><input id="aNo" placeholder="INV-001" autocomplete="off"></div>
    </div>
    <label for="aDesc">Description</label>
    <input id="aDesc" placeholder="What was supplied or done" autocomplete="off">
    <label for="aAmt">Amount (P)</label>
    <input id="aAmt" type="number" step="0.01" min="0" inputmode="decimal">
    <div class="btns"><button id="add">Add invoice</button></div>
    <div class="status" id="status" role="status"></div>

    <h2>Payment details</h2>
    <label for="bBank">Bank</label><input id="bBank" autocomplete="off">
    <label for="bName">Account name</label><input id="bName" autocomplete="off">
    <label for="bNo">Account number</label><input id="bNo" inputmode="numeric" autocomplete="off">
    <label for="bBranch">Branch</label><input id="bBranch" autocomplete="off">

    <div class="btns">
      <button id="print">Print / Save as PDF</button>
      <button class="ghost" id="clear">Start a new statement</button>
    </div>
  </aside>

  <main>
    <div class="sheet" id="sheet-out"></div>
  </main>
</div>

function say(msg, err){ const s=$('status'); s.textContent = msg; s.className = 'status' + (err?' err':''); }

function render(){
  const items = [...draft.items].sort((a,b) => (a.date+a.no).localeCompare(b.date+b.no));
  const due = items.filter(i => !i.paid).reduce((s,i)=>s+i.amount,0);
  const paidTotal = items.filter(i => i.paid).reduce((s,i)=>s+i.amount,0);

  const body = items.length ? `
    <table>
      <thead><tr><th>Date</th><th>Invoice</th><th>Description</th><th class="n">Amount (P)</th><th class="no-print"></th></tr></thead>
      <tbody>${items.map(i => `
        <tr class="${i.paid?'paid':''}">
          <td class="d">${esc(fmtDate(i.date))}</td><td>${esc(i.no)}</td>
          <td>${esc(i.description)} ${i.paid?'<span class="tag">Paid</span>':''}</td>
          <td class="n">${money(i.amount)}</td>
          <td class="no-print act">
            <label style="display:inline;margin:0;font-size:12px"><input type="checkbox" data-paid="${i.id}" ${i.paid?'checked':''}> Paid</label>
            <button class="ghost" data-edit="${i.id}">Edit</button>
            <button class="del" data-del="${i.id}">Delete</button>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>
    <div class="totals">
      ${paidTotal ? `<div><span>Already paid</span><span>P${money(paidTotal)}</span></div>` : ''}
      <div class="due"><span>Balance due</span><span>P${money(due)}</span></div>
    </div>` : `<div class="empty">No invoices yet.<br>Add an invoice on the left and it appears here.</div>`;

  const bankLines = [draft.bank && `Bank: ${esc(draft.bank)}`, draft.name && `Account name: ${esc(draft.name)}`, draft.no && `Account number: ${esc(draft.no)}`, draft.branch && `Branch: ${esc(draft.branch)}`].filter(Boolean);
  const period = (draft.from || draft.to) ? ` &nbsp;|&nbsp; ${esc(draft.from?fmtDate(draft.from):'Start')} to ${esc(draft.to?fmtDate(draft.to):'today')}` : '';

  $('sheet-out').innerHTML = `
    <div class="head">
      <img src="${LOGO}" alt="BMES logo">
      <div>
        <h1>Bakery Maintenance &amp; Electrical Solutions (BMES)</h1>
        <p>Plot 11104, Mogoditshane, Kweneng</p>
        <p>Cell: 71545547 &nbsp;|&nbsp; bmes.team26@gmail.com</p>
      </div>
    </div>
    <div class="title">
      <h2>Statement of Invoices</h2>
      <div class="meta">${esc(fmtDate(draft.stDate || iso(new Date())))}${period}</div>
    </div>
    <div class="to">Statement for: <b>${esc(draft.client || 'Client name')}</b></div>
    ${body}
    ${bankLines.length ? `<div class="bank"><b>Payment details</b>${bankLines.join('<br>')}</div>` : ''}
    <div class="foot">Competency &amp; Guaranteed Electrical Solutions</div>`;
}

/* ---- inputs that update the statement live ---- */
const bind = [['client','client'],['stDate','stDate'],['from','from'],['to','to'],['bBank','bank'],['bName','name'],['bNo','no'],['bBranch','branch']];
bind.forEach(([id,k]) => $(id).addEventListener('input', () => { draft[k] = $(id).value; save(); render(); }));

/* ---- add / edit / delete invoices ---- */
let nextId = Date.now();
$('add').addEventListener('click', () => {
  const amount = parseFloat($('aAmt').value);
  const item = { id: ++nextId, date: $('aDate').value || iso(new Date()), no: $('aNo').value.trim(),
                 description: $('aDesc').value.trim(), amount, paid:false };
  if(!item.no || !(amount > 0)){ say('Enter an invoice number and an amount.', true); return; }
  draft.items.push(item); save();
  ['aNo','aDesc','aAmt'].forEach(id => $(id).value = '');
  say('Invoice added.'); render(); $('aNo').focus();
});

$('sheet-out').addEventListener('click', e => {
  const t = e.target;
  if(t.dataset.del){
    draft.items = draft.items.filter(i => String(i.id) !== t.dataset.del); save(); render();
  }
  if(t.dataset.edit){
    const it = draft.items.find(i => String(i.id) === t.dataset.edit);
    if(it){
      $('aDate').value = it.date; $('aNo').value = it.no; $('aDesc').value = it.description; $('aAmt').value = it.amount;
      draft.items = draft.items.filter(i => i !== it); save(); render();
      say('Change the details, then tap Add invoice.');
    }
  }
});
$('sheet-out').addEventListener('change', e => {
  const id = e.target.dataset.paid;
  if(id){ const it = draft.items.find(i => String(i.id) === id); if(it){ it.paid = e.target.checked; save(); render(); } }
});

$('print').addEventListener('click', () => window.print());
$('clear').addEventListener('click', () => {
  if(!confirm('Clear the invoices and client for a new statement? Your payment details stay.')) return;
  draft.items = []; draft.client = ''; draft.from = ''; draft.to = ''; save();
  $('client').value = ''; $('from').value = ''; $('to').value = '';
  say('Ready for a new statement.'); render();
});

/* ---- start ---- */
(function init(){
  const today = iso(new Date());
  if(!draft.stDate) draft.stDate = today;
  $('client').value = draft.client; $('stDate').value = draft.stDate;
  $('from').value = draft.from; $('to').value = draft.to;
  $('aDate').value = today;
  $('bBank').value = draft.bank; $('bName').value = draft.name; $('bNo').value = draft.no; $('bBranch').value = draft.branch;
  render();
})();
</script>
</body>
</html>
